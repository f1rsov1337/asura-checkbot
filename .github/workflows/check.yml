name: Check new chapters

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (GitHub может запускать с задержкой)
  workflow_dispatch:          # ручной запуск из вкладки Actions

permissions:
  contents: write             # чтобы закоммитить state.json

concurrency:
  group: chapter-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "chapter-bot"
            git config user.email "chapter-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
